[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "schloss-wernigerode-monitor"
version = "0.1.0"
description = "Read-only monitor for public appointments at Schloss Wernigerode"
readme = "README.md"
license = { text = "MIT" }
keywords = ["appointments", "monitoring", "playwright", "telegram", "wernigerode"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
requires-python = ">=3.12"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "playwright==1.58.0",
]

[project.urls]
Repository = "https://github.com/quotschmacher/schloss_wernigerode_scraper"
Issues = "https://github.com/quotschmacher/schloss_wernigerode_scraper/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.9,<1",
]

[project.scripts]
schloss-monitor = "schloss_monitor.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
